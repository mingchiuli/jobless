name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust module layout
        run: bun run scripts/check-mod-layout.ts

      - name: Check generated protocol
        run: |
          cargo test -p jobless-browser --lib
          git diff --exit-code -- browser-worker/src/generated

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Install worker dependencies
        working-directory: browser-worker
        run: bun install --frozen-lockfile

      - name: Typecheck worker
        working-directory: browser-worker
        run: bun run typecheck

      - name: Typecheck scripts
        working-directory: browser-worker
        run: bun run typecheck:scripts

      - name: Test worker
        working-directory: browser-worker
        run: bun test src/test
