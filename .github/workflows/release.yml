name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev vulkan-validationlayers libvulkan1 \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools dbus-x11

      - name: Prepare bundled runtime
        run: bun run scripts/prepare-runtime.ts

      - name: Install Chromium system dependencies on Linux
        if: runner.os == 'Linux'
        working-directory: browser-worker
        run: bun ./node_modules/patchright/cli.js install-deps chromium

      - name: Cross-platform worker browser smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtime/chromium
        run: bun browser-worker/src/healthcheck.ts

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test packaged runtime on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LVP_ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd.*.json' | head -1)"
          test -n "$LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD"
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 120s dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" \
            env VK_DRIVER_FILES="$LVP_ICD" LIBGL_ALWAYS_SOFTWARE=1 \
            JOBLESS_RUNTIME_DIR="$GITHUB_WORKSPACE/runtime" \
            "$GITHUB_WORKSPACE/target/release/jobless" --smoke-test

      - name: Package portable archive
        shell: bash
        env:
          JOBLESS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
        run: bun run scripts/package.ts

      - uses: actions/upload-artifact@v4
        with:
          name: jobless-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
